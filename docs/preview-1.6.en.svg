<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2547"/>
      <stop offset="1" stop-color="#121117"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8AD8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="ava" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB6D9"/>
      <stop offset="1" stop-color="#B36BFF"/>
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="1" stop-color="#FFC300"/>
    </linearGradient>
    <!-- Обои под стеклом -->
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7E5F"/>
      <stop offset="0.5" stop-color="#B34DFF"/>
      <stop offset="1" stop-color="#3A47D5"/>
    </linearGradient>
    <!-- Стекло: светлое сверху, темнее снизу -->
    <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <!-- Кромка-линза: яркая слева сверху и справа снизу -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#D6E8FF" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="glassRow"><rect x="32" y="416" width="436" height="80" rx="22"/></clipPath>
    <!-- Стрелка поворота направо -->
    <g id="turn" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 22 V12 a4 4 0 0 1 4 -4 H19"/>
      <path d="M15 4 L19 8 L15 12"/>
    </g>
    <path id="moon" d="M264 480A232 232 0 0132 248c0-94 54-178.28 137.61-214.67a16 16 0 0121.06 21.06C181.07 76.43 176 104.66 176 136c0 110.28 89.72 200 200 200 31.34 0 59.57-5.07 81.61-14.67a16 16 0 0121.06 21.06C442.28 426 358 480 264 480z"/>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>

  <!-- Левая колонка: свёрнутые -->
  <g>
    <!-- Навигатор: стрелка и метры -->
    <rect x="32" y="32" width="436" height="80" rx="22" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="135" y="52" width="230" height="40" rx="20" fill="#000"/>
    <use href="#turn" transform="translate(147 60) scale(0.95)" stroke="#34C759"/>
    <text x="352" y="78" font-size="16" font-weight="600" fill="#34C759" text-anchor="end">300 m</text>
    <text x="52" y="77" font-size="13" fill="#9C98B8">navigation</text>

    <!-- Приложите к терминалу -->
    <rect x="32" y="128" width="436" height="80" rx="22" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="70" y="148" width="360" height="40" rx="20" fill="#000"/>
    <g fill="none" stroke="#C6C3F7" stroke-width="2.4" stroke-linecap="round">
      <path d="M90 162 a9 9 0 0 1 0 12" stroke-opacity="0.55"/>
      <path d="M95 158 a15 15 0 0 1 0 20" stroke-opacity="0.75"/>
      <path d="M100 154 a21 21 0 0 1 0 28"/>
    </g>
    <text x="118" y="174" font-size="16" font-weight="600" fill="#fff">Pay</text>
    <text x="376" y="173" font-size="13" fill="#8E8E93" text-anchor="end">Hold near reader</text>
    <rect x="386" y="157" width="22" height="22" rx="6" fill="url(#bank)"/>

    <!-- Оплачено -->
    <rect x="32" y="224" width="436" height="80" rx="22" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="70" y="244" width="360" height="40" rx="20" fill="#000"/>
    <circle cx="97" cy="264" r="11" fill="#34C759"/>
    <path d="M91.5 264.5 l3.8 3.8 l7 -7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="118" y="270" font-size="16" font-weight="600" fill="#fff">Paid</text>
    <text x="408" y="270" font-size="16" font-weight="600" fill="#34C759" text-anchor="end">$12.50</text>

    <!-- Не беспокоить -->
    <rect x="32" y="320" width="436" height="80" rx="22" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="70" y="340" width="360" height="40" rx="20" fill="#000"/>
    <use href="#moon" transform="translate(87 349) scale(0.042)" fill="#BF5AF2"/>
    <text x="118" y="366" font-size="16" font-weight="600" fill="#fff">Do Not Disturb</text>
    <text x="408" y="366" font-size="16" font-weight="600" fill="#BF5AF2" text-anchor="end">On</text>

    <!-- Liquid Glass поверх ярких обоев -->
    <g clip-path="url(#glassRow)">
      <rect x="32" y="416" width="436" height="80" fill="url(#wall)"/>
      <circle cx="420" cy="420" r="60" fill="#FFD27A" fill-opacity="0.45"/>
      <circle cx="90" cy="500" r="50" fill="#ffffff" fill-opacity="0.25"/>
    </g>
    <rect x="135" y="436" width="230" height="40" rx="20" fill="#1A1033" fill-opacity="0.35"/>
    <rect x="135" y="436" width="230" height="40" rx="20" fill="url(#glassBody)"/>
    <rect x="137" y="438" width="226" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
    <rect x="135.75" y="436.75" width="228.5" height="38.5" rx="19.25" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
    <rect x="146" y="442" width="28" height="28" rx="7" fill="url(#art)"/>
    <g fill="#ffffff">
      <rect x="316" y="450" width="3.5" height="12" rx="1.75"/>
      <rect x="323" y="445" width="3.5" height="22" rx="1.75"/>
      <rect x="330" y="448" width="3.5" height="16" rx="1.75"/>
      <rect x="337" y="443" width="3.5" height="26" rx="1.75"/>
      <rect x="344" y="451" width="3.5" height="10" rx="1.75"/>
    </g>
    <text x="52" y="452" font-size="13" font-weight="600" fill="#fff">Liquid</text>
    <text x="52" y="469" font-size="13" font-weight="600" fill="#fff">Glass</text>
    <rect x="376" y="447" width="82" height="18" rx="9" fill="#1C1B22" fill-opacity="0.55"/>
    <text x="417" y="460" font-size="10.5" font-weight="600" fill="#FFB340" text-anchor="middle">experimental</text>
  </g>

  <!-- Правая колонка: раскрытые -->
  <g>
    <!-- Плашка уведомления с кнопками -->
    <rect x="492" y="32" width="436" height="188" rx="22" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="512" y="48" width="396" height="156" rx="30" fill="#000"/>
    <circle cx="552" cy="88" r="22" fill="url(#ava)"/>
    <text x="552" y="95" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">A</text>
    <circle cx="568" cy="104" r="8.5" fill="#2AABEE" stroke="#000" stroke-width="2.5"/>
    <text x="586" y="83" font-size="17" font-weight="600" fill="#fff">Anna</text>
    <text x="634" y="83" font-size="13" fill="#8E8E93">• now</text>
    <path d="M684 70 a5 5 0 0 1 5 5 v4 l2 2.5 h-14 l2 -2.5 v-4 a5 5 0 0 1 5 -5 z M682 83.5 h4 a2 2 0 0 1 -4 0 z" fill="#8E8E93"/>
    <rect x="840" y="64" width="50" height="26" rx="13" fill="#C6C3F7"/>
    <text x="857" y="82" font-size="15" font-weight="700" fill="#1C1B22" text-anchor="middle">3</text>
    <path d="M869 74.5 l4 4 l4 -4" fill="none" stroke="#1C1B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="586" y="110" font-size="16" fill="#fff">Hey! This is how a notification</text>
    <text x="586" y="131" font-size="16" fill="#fff">looks in the island</text>
    <text x="586" y="180" font-size="15" font-weight="700" fill="#C6C3F7">Reply</text>
    <text x="652" y="180" font-size="15" font-weight="700" fill="#C6C3F7">Mark as read</text>

    <!-- Раскрытый навигатор -->
    <rect x="492" y="236" width="436" height="164" rx="22" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="512" y="252" width="396" height="132" rx="40" fill="#000"/>
    <circle cx="562" cy="300" r="27" fill="#34C759" fill-opacity="0.16"/>
    <use href="#turn" transform="translate(547 284) scale(1.25)" stroke="#34C759"/>
    <text x="604" y="292" font-size="22" font-weight="700" fill="#fff">300 m</text>
    <text x="604" y="313" font-size="13" fill="#8E8E93">Turn right onto Main Street</text>
    <text x="604" y="333" font-size="13" font-weight="600" fill="#34C759">Arrive 18:42 · 12 min · 4.2 km</text>
    <rect x="604" y="344" width="82" height="28" rx="14" fill="#34C759"/>
    <path d="M617 360 l12 -6 l-5 12 l-1.5 -4.5 z" fill="#000"/>
    <text x="636" y="363" font-size="13" font-weight="600" fill="#000">Open</text>

    <!-- Широкая плашка навигатора при запуске -->
    <rect x="492" y="416" width="436" height="80" rx="22" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="530" y="436" width="360" height="40" rx="20" fill="#000"/>
    <use href="#turn" transform="translate(543 444) scale(0.95)" stroke="#34C759"/>
    <text x="574" y="462" font-size="17" font-weight="700" fill="#fff">300 m</text>
    <text x="872" y="453" font-size="11" fill="#ffffff" fill-opacity="0.85" text-anchor="end">Main Street</text>
    <text x="872" y="468" font-size="11" font-weight="600" fill="#34C759" text-anchor="end">18:42 · 12 min</text>
  </g>
</svg>
