name: Сборка APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DynamicIsland.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DynamicIsland-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-apk
          path: out/*.apk

      # Релиз выходит сам, когда в app/build.gradle.kts повышают versionName
      # (или когда пушат тег v*). Описание на двух языках: CHANGELOG.en.md и CHANGELOG.md.
      # Если релиз этой версии уже есть, push в основную ветку обновляет его описание.
      - name: Версия
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$v"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          default="refs/heads/${{ github.event.repository.default_branch }}"
          exists=false
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exists=true
          release=false
          update=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "$default" ]]; then
            if [[ "$exists" == true ]]; then update=true; else release=true; fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "update=$update" >> "$GITHUB_OUTPUT"

      - name: Описание релиза из CHANGELOG.en.md и CHANGELOG.md
        if: steps.ver.outputs.release == 'true' || steps.ver.outputs.update == 'true'
        run: |
          v="${{ steps.ver.outputs.tag }}"
          v="${v#v}"
          section() { awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' "$1"; }
          {
            echo "## 🇬🇧 English"
            section CHANGELOG.en.md
            printf '\n**Install:** download `DynamicIsland.apk` below and open it on your phone. A new version installs over the old one, your settings are kept. The app interface is in Russian for now.\n\n---\n\n'
            echo "## 🇷🇺 Русский"
            section CHANGELOG.md
            printf '\n**Установка:** скачайте `DynamicIsland.apk` ниже и откройте на телефоне. Новая версия ставится поверх старой, настройки сохраняются.\n'
          } > notes.md
          cat notes.md

      - name: Релиз
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dynamic Island ${{ steps.ver.outputs.tag }} · Динамический остров
          body_path: notes.md
          files: out/DynamicIsland.apk
          make_latest: true

      - name: Обновить описание вышедшего релиза
        if: steps.ver.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file notes.md --title "Dynamic Island $tag · Динамический остров"
