name: Сборка APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DynamicIsland.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DynamicIsland-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-apk
          path: out/*.apk

      # Релиз выходит сам, когда в app/build.gradle.kts повышают versionName
      # (или когда пушат тег v*). Описание берётся из CHANGELOG.md.
      - name: Версия
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$v"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          default="refs/heads/${{ github.event.repository.default_branch }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "$default" ]] && ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Описание релиза из CHANGELOG.md
        if: steps.ver.outputs.release == 'true'
        run: |
          v="${{ steps.ver.outputs.tag }}"
          v="${v#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n\n**Установка:** скачайте `DynamicIsland.apk` ниже и откройте на телефоне. Новая версия ставится поверх старой, настройки сохраняются.\n' >> notes.md
          cat notes.md

      - name: Релиз
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Динамический остров ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          files: out/DynamicIsland.apk
          make_latest: true
