name: Сборка APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DynamicIsland.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DynamicIsland-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-apk
          path: out/*.apk

      - name: Описание релиза из CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n\n**Установка:** скачайте `DynamicIsland.apk` ниже и откройте на телефоне. Новая версия ставится поверх старой, настройки сохраняются.\n' >> notes.md
          cat notes.md

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Динамический остров ${{ github.ref_name }}
          body_path: notes.md
          files: out/DynamicIsland.apk
